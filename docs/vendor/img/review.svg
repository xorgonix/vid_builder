<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="vid-build review: candidate comparison with receipts">
  <rect width="1200" height="760" fill="#020617"/>
  <rect x="0" y="0" width="1200" height="48" fill="#111827"/>
  <circle cx="28" cy="24" r="7" fill="#ef4444"/><circle cx="52" cy="24" r="7" fill="#f59e0b"/><circle cx="76" cy="24" r="7" fill="#22c55e"/>
  <text x="110" y="30" fill="#94a3b8" font-family="sans-serif" font-size="18">vid-build · Review · Studio wide · Start frame</text>

  <g font-family="sans-serif">
    <g transform="translate(40,90)">
      <rect width="540" height="300" rx="12" fill="#0b0f14" stroke="#334155"/>
      <rect x="20" y="20" width="500" height="190" rx="8" fill="#1e293b"/>
      <circle cx="270" cy="120" r="46" fill="#f472b6" fill-opacity="0.85"/>
      <text x="20" y="245" fill="#e2e8f0" font-size="15">seed 1024 · photon_v1</text>
      <rect x="20" y="262" width="120" height="22" rx="11" fill="#166534"/><text x="80" y="278" fill="#bbf7d0" font-size="13" text-anchor="middle">selected</text>
      <rect x="152" y="262" width="130" height="22" rx="11" fill="#1e3a8a"/><text x="217" y="278" fill="#bfdbfe" font-size="13" text-anchor="middle">approve</text>
    </g>
    <g transform="translate(620,90)">
      <rect width="540" height="300" rx="12" fill="#0b0f14" stroke="#334155"/>
      <rect x="20" y="20" width="500" height="190" rx="8" fill="#1e293b"/>
      <circle cx="250" cy="130" r="46" fill="#f472b6" fill-opacity="0.6"/>
      <text x="20" y="245" fill="#e2e8f0" font-size="15">seed 1025 · photon_v1</text>
      <rect x="20" y="262" width="120" height="22" rx="11" fill="#334155"/><text x="80" y="278" fill="#cbd5e1" font-size="13" text-anchor="middle">candidate</text>
    </g>

    <g transform="translate(40,420)">
      <rect width="1120" height="280" rx="12" fill="#111827"/>
      <text x="24" y="40" fill="#7dd3fc" font-size="16" letter-spacing="2">RECEIPT</text>
      <text x="24" y="78" fill="#94a3b8" font-size="15">model        photon_v1.safetensors</text>
      <text x="24" y="106" fill="#94a3b8" font-size="15">seed         1024</text>
      <text x="24" y="134" fill="#94a3b8" font-size="15">workflow     sha256 9f2a4c1b…  (SDXL txt2img, immutable)</text>
      <text x="24" y="162" fill="#94a3b8" font-size="15">duration     8.4 s</text>
      <text x="24" y="190" fill="#94a3b8" font-size="15">checksum     sha256 3ac9d0f7…</text>
      <text x="640" y="78" fill="#94a3b8" font-size="15">Comparison controls</text>
      <text x="640" y="106" fill="#64748b" font-size="14">zoom · synchronized pan · full size</text>
      <text x="640" y="134" fill="#64748b" font-size="14">select · approve · exception · assess</text>
      <text x="640" y="162" fill="#64748b" font-size="14">assessments are advisory; approval is human</text>
    </g>
